<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlabWorks</title>
</head>
<body class="bg-gray-50">
  <div class="flex flex-col md:flex-row h-screen">
    <!-- Main Canvas Area -->
    <div class="flex-1 p-4 md:p-6">
      <div id="container" class="bg-white border border-gray-200 rounded-lg shadow-md h-full relative overflow-hidden">
        <!-- Canvas for dragging wood pieces -->
      </div>
    </div>
    <!-- Shelf Sidebar -->
    <div id="shelf" class="w-full md:w-1/3 max-w-md p-4 md:p-6 bg-white border-t md:border-t-0 md:border-l border-gray-200 shadow-inner flex flex-col">
      <div class="mb-4">
        <label for="imageUpload" class="block text-sm font-medium text-gray-700">Upload Wood Image</label>
        <input type="file" id="imageUpload" class="mt-2 block w-full text-sm text-gray-500
               file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0
               file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700
               hover:file:bg-indigo-100">
      </div>
      <div class="mb-4">
        <h3 class="text-sm font-medium text-gray-700 mb-2">Target Area</h3>
        <div class="flex items-center gap-2 mb-2">
          <label for="target-width" class="text-xs text-gray-600 w-12">Width</label>
          <input type="number" id="target-width" value="24" min="1"
                 class="w-20 text-sm border border-gray-300 rounded px-2 py-1">
          <span class="text-xs text-gray-500">in</span>
        </div>
        <div class="flex items-center gap-2 mb-2">
          <label for="target-height" class="text-xs text-gray-600 w-12">Height</label>
          <input type="number" id="target-height" value="48" min="1"
                 class="w-20 text-sm border border-gray-300 rounded px-2 py-1">
          <span class="text-xs text-gray-500">in</span>
        </div>
        <div class="flex items-center gap-2">
          <label for="target-shape" class="text-xs text-gray-600 w-12">Shape</label>
          <select id="target-shape" class="text-sm border border-gray-300 rounded px-2 py-1">
            <option value="rectangle">Rectangle</option>
            <option value="ellipse">Ellipse</option>
          </select>
        </div>
      </div>
      <div class="mb-4">
        <button id="cut-btn" disabled
          class="w-full py-2 px-4 bg-indigo-600 text-white text-sm font-semibold rounded-md
                 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-indigo-700">
          Cut to Target
        </button>
      </div>
      <div class="mb-4">
        <h3 class="text-sm font-medium text-gray-700 mb-2">Projects</h3>
        <div class="flex items-center gap-2 mb-2">
          <input type="text" id="project-name" placeholder="Project name"
                 class="flex-1 text-sm border border-gray-300 rounded px-2 py-1">
          <button id="save-btn"
            class="py-1 px-3 bg-green-600 text-white text-sm font-semibold rounded-md hover:bg-green-700">
            Save
          </button>
        </div>
        <div class="flex items-center gap-2">
          <select id="project-list" class="flex-1 text-sm border border-gray-300 rounded px-2 py-1">
            <option value="">-- select project --</option>
          </select>
          <button id="load-btn"
            class="py-1 px-3 bg-blue-600 text-white text-sm font-semibold rounded-md hover:bg-blue-700">
            Load
          </button>
        </div>
      </div>
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Shelf</h2>
      <div id="shelf-thumbnails" class="grid grid-cols-2 gap-4 overflow-y-auto">
        <!-- Thumbnails of uploaded wood images -->
      </div>
    </div>
  </div>
</body>
</html>
